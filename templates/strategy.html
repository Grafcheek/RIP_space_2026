<html lang="ru">
    <head>
        <title>{{ .route.Title }} — межпланетный маршрут</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body class="detail-page">
        <header class="site-header site-header--center-logo">
            <a href="/" class="header-home">
                <img src="/static/img/logo.png" alt="Interplanetary flight" class="header-home__icon">
            </a>
        </header>
        <main class="detail-shorts">
            <div class="detail-shorts__video-col">
                <div class="detail-video-frame detail-video-frame--shorts{{ if .hasFlightInRequestData }} detail-video-frame--with-rail{{ end }}">
                    <video
                        class="detail-video"
                        autoplay
                        muted
                        loop
                        playsinline
                    >
                        <source src="http://localhost:9000/spaceobjects/{{ .route.Video }}" type="video/mp4">
                    </video>
                    {{ if .hasFlightInRequestData }}
                    <aside class="detail-video__rail" aria-label="Параметры расчёта перелёта">
                        <div class="detail-rail-item" title="Характеристическая скорость Δv">
                            <div class="detail-rail-item__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 3c0 0-3 4.5-3 9.5 0 2.5 1 4.5 2.5 6L12 21l.5-2c1.5-1.5 2.5-3.5 2.5-6C15 7.5 12 3 12 3z" stroke="currentColor" stroke-width="1.35" stroke-linejoin="round"/>
                                    <path d="M9 14h6M10.5 17h3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                    <path d="M12 10v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <span class="detail-rail-item__value">{{ printf "%.0f" .flightInRequest.DeltaVms }}</span>
                            <span class="detail-rail-item__unit">м/с</span>
                            <span class="detail-rail-item__label">Δv</span>
                        </div>
                        <div class="detail-rail-item" title="Требуемое топливо">
                            <div class="detail-rail-item__icon" aria-hidden="true">
                                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <path d="M12 3C9.5 3 8 5 8 7.5V9C6.5 9.5 5.5 11 5.5 13V18C5.5 20 7 21.5 9 21.5H15C17 21.5 18.5 20 18.5 18V13C18.5 11 17.5 9.5 16 9V7.5C16 5 14.5 3 12 3Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/>
                                    <path d="M10 9H14" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                                </svg>
                            </div>
                            <span class="detail-rail-item__value">{{ printf "%.0f" .flightInRequest.PropellantKg }}</span>
                            <span class="detail-rail-item__unit">кг</span>
                            <span class="detail-rail-item__label">Топливо</span>
                        </div>
                    </aside>
                    {{ end }}
                    <div class="detail-video__caption detail-video__caption--shorts">
                        <p class="detail-video__route">{{ .route.From }} — {{ .route.To }}</p>
                        <p class="detail-video__blurb">{{ .route.Description }}</p>
                    </div>
                </div>
            </div>
        </main>
    </body>
</html>
