<html lang="ru">
    <head>
        <title>Межпланетные маршруты — каталог</title>
        <link rel="stylesheet" href="/static/css/styles.css">
    </head>
    <body>
        <header class="site-header site-header-main">
            <div class="header-spacer"></div>
            <a href="/" class="header-home header-logo-center">
                <img src="/static/img/logo.png" alt="Voyager mission" class="header-home__icon">
            </a>
            <div class="header-spacer"></div>
        </header>
        <div class="toolbar">
            <div class="toolbar-inner">
                <form action="/" method="GET" class="search-form">
                    <input
                        type="text"
                        name="query"
                        class="search-input"
                        placeholder="Поиск маршрутов и планет"
                        value="{{ .query }}">
                </form>
                <div class="toolbar-basket">
                    {{ if .hasDraft }}
                    <a href="/missions/{{ .draftID }}" class="system-load-icon" aria-label="Текущая заявка interplanetary flight">
                        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none">
                            <path d="M4 7h16v2H4V7zm2 4h12v2H6v-2zm3 4h6v2H9v-2z" fill="currentColor"/>
                        </svg>
                        <span class="system-load-icon__badge">{{ .draftSize }}</span>
                    </a>
                    {{ end }}
                </div>
            </div>
        </div>
        <div class="space">
            <div class="container">
                {{ range .routes }}
                <a href="/routes/{{ .ID }}" class="card">
                    <img src="http://localhost:9000/spaceobjects/{{ .Image }}" alt="{{ .Title }}">
                    <div class="card__body">
                        <div class="card__title-row">
                            <h2 class="card__title">{{ .Title }}</h2>
                            <span class="card__icon" aria-hidden="true">
                                <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                                    <circle class="color-nasa-red" cx="16" cy="16" r="16"></circle>
                                    <path d="M8 16.956h12.604l-3.844 4.106 1.252 1.338L24 16l-5.988-6.4-1.252 1.338 3.844 4.106H8v1.912z" class="color-spacesuit-white"></path>
                                </svg>
                            </span>
                        </div>
                    </div>
                </a>
                {{ end }}
            </div>
        </div>
    </body>
</html>
